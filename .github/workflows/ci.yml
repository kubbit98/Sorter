name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Sorter.sln

      - name: Build
        run: dotnet build Sorter.sln -c Release --no-restore

      # no-op until a test project is added to the solution
      - name: Test
        run: dotnet test Sorter.sln -c Release --no-build
