name: Release

# Push a tag like v0.13.0-beta to build both packages and create a draft release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore Sorter.sln

      - name: Build
        run: dotnet build Sorter.sln -c Release --no-restore -p:Version="$VERSION"

      - name: Test
        run: dotnet test Sorter.sln -c Release --no-build

      - name: Publish
        run: |
          for rid in win-x64 linux-x64; do
            dotnet publish src/Sorter/Sorter.csproj -c Release -p:PublishProfile="$rid" -p:Version="$VERSION" -o "out/$rid"
          done

      - name: Package
        run: |
          (cd out/win-x64 && zip -qr "../v$VERSION-win64.zip" .)
          tar -czf "out/v$VERSION-linux64.tar.gz" -C out/linux-x64 .

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "out/v$VERSION-win64.zip" "out/v$VERSION-linux64.tar.gz"
          --draft --generate-notes --title "$GITHUB_REF_NAME"
